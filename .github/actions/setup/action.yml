name: Set up Node.js project
description: Install the Node.js version from .nvmrc with npm cache, then run npm ci (lifecycle scripts disabled by .npmrc).
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
