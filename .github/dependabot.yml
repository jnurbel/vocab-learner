version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    # Let new releases age before adopting them (supply-chain attacks are often
    # detected and yanked within days). Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not yet supported by typescript-eslint (<6.1) and svelte-check (^5 || ^6):
      # npm ci fails with a peer dependency conflict. Revisit when both accept it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
