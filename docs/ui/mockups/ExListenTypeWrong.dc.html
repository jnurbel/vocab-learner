<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dictée tapée, erreur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17705A}a:hover{color:#0F4F3F}
</style>
</helmet>
<div style="width: 1280px; height: 820px; background: #F6F4EE; color: #1E2A2F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; box-sizing: border-box; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 20px; padding: 20px 48px; background: #FFFFFF; border-bottom: 1px solid #E3DFD5">
    <button aria-label="Quitter la session" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E3DFD5; background: #FFFFFF; color: #1E2A2F; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 6px; flex: 1">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><strong>Le Messager · dictée tapée</strong><span style="color: #5B6770">3 / 8</span></div>
      <div style="height: 10px; background: #EDEAE2; border-radius: 999px; overflow: hidden"><div style="width: 37%; height: 100%; background: #17705A"></div></div>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 28px 48px">
    <div role="status" style="display: flex; align-items: center; gap: 12px; background: #FBE7D8; color: #6E2F07; border-radius: 14px; padding: 12px 20px; font-size: 17px; font-weight: 700">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #8A3D0B; color: #FFFFFF; display: flex; align-items: center; justify-content: center">✗</span>
      Bon son, mauvais caractère : <span lang="zh-CN" style="font-family: 'Noto Sans SC', sans-serif">再</span> au lieu de <span lang="zh-CN" style="font-family: 'Noto Sans SC', sans-serif">在</span>.
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E3DFD5; border-radius: 24px; padding: 32px 48px; display: grid; grid-template-columns: 160px minmax(0, 1fr); row-gap: 20px; column-gap: 24px; align-items: center; width: 100%; max-width: 820px; box-sizing: border-box">
      <span style="font-size: 14px; font-weight: 700; color: #5B6770">Attendu</span>
      <div style="display: flex; align-items: baseline; gap: 18px">
        <span lang="zh-CN" style="font-family: 'Noto Sans SC', sans-serif; font-size: 48px">现在</span>
        <span style="font-size: 18px; color: #3B464D">xiànzài · maintenant</span>
      </div>
      <span style="font-size: 14px; font-weight: 700; color: #5B6770">Ta réponse</span>
      <div style="display: flex; align-items: baseline; gap: 6px" aria-label="现 juste, 再 faux à la place de 在">
        <span lang="zh-CN" style="font-family: 'Noto Sans SC', sans-serif; font-size: 48px; color: #0F4F3F; text-decoration: underline; text-decoration-color: #17705A; text-decoration-thickness: 3px; text-underline-offset: 8px">现</span>
        <span lang="zh-CN" style="font-family: 'Noto Sans SC', sans-serif; font-size: 48px; color: #8A3D0B; text-decoration: line-through; text-decoration-thickness: 3px">再</span>
      </div>
      <span style="font-size: 14px; font-weight: 700; color: #5B6770">À retenir</span>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; font-size: 15px">
        <span style="background: #F6F4EE; border-radius: 12px; padding: 10px 14px"><span lang="zh-CN" style="font-family: 'Noto Sans SC', sans-serif; font-size: 20px">在</span> zài · être à, en train de</span>
        <span style="background: #F6F4EE; border-radius: 12px; padding: 10px 14px"><span lang="zh-CN" style="font-family: 'Noto Sans SC', sans-serif; font-size: 20px">再</span> zài · de nouveau</span>
      </div>
    </div>
  </main>

  <footer style="display: flex; justify-content: space-between; align-items: center; padding: 20px 48px; border-top: 1px solid #E3DFD5; background: #FFFFFF">
    <div style="display: flex; gap: 10px">
      <button style="border: 1px solid #C9C3B5; background: #FFFFFF; color: #1E2A2F; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 700; font-size: 14px; min-height: 48px">Réécouter</button>
      <span style="align-self: center; font-size: 14px; color: #5B6770">Ce mot reviendra en fin de session et demain.</span>
    </div>
    <button style="border: 0; background: #1E2A2F; color: #FFFFFF; border-radius: 12px; padding: 12px 24px; font: inherit; font-weight: 800; font-size: 15px; min-height: 48px">Continuer (Entrée)</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
